!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Dashboard</title>

  <!-- Tailwind CSS CDN with Dark Mode Support -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts (Cairo for Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

  <script>
    // Configure Tailwind with Dark Mode Support
    tailwind.config = {
      darkMode: 'class', // Enable class-based dark mode
      theme: {
        extend: {
          fontFamily: {
            'sans': ['Cairo', 'sans-serif'],
          },
        }
      }
    }

    // Auto-detect system dark mode preference
    if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
    
    // Load language preference
    const savedLang = localStorage.getItem('language') || 'en';
    if (savedLang === 'ar') {
      document.documentElement.lang = 'ar';
      document.documentElement.dir = 'rtl';
    } else {
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
    }
  </script>

  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .fade-in {
      animation: fadeIn 0.6s ease-out;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-blue-600 via-blue-500 to-blue-700 dark:from-gray-900 dark:via-gray-800 dark:to-gray-900 min-h-screen flex items-center justify-center p-4">

  <!-- Background Pattern -->
  <div class="absolute inset-0 opacity-10">
    <div class="absolute top-0 left-0 w-96 h-96 bg-white rounded-full mix-blend-multiply filter blur-3xl"></div>
    <div class="absolute bottom-0 right-0 w-96 h-96 bg-white rounded-full mix-blend-multiply filter blur-3xl"></div>
  </div>

  <!-- Login Container -->
  <div class="relative z-10 w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8 fade-in">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-white dark:bg-gray-800 rounded-2xl shadow-lg mb-4">
        <i class="fas fa-chart-line text-3xl text-blue-600"></i>
      </div>
      <h1 class="text-4xl font-bold text-white dark:text-gray-100 mb-2 login-title">Login</h1>
      <p class="text-blue-100 dark:text-gray-400 text-lg login-subtitle">SMM Dashboard</p>
    </div>

    <!-- Login Card -->
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 fade-in" style="animation-delay: 0.1s;">
      <form id="loginForm" class="space-y-6">
        <!-- Username Field -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 login-label-username">
            <i class="fas fa-user me-2 text-blue-600"></i>Username
          </label>
          <input 
            name="username" 
            type="text"
            placeholder="Enter your username" 
            class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-900 transition bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 login-placeholder-username" 
            required
            autocomplete="username"
          >
        </div>

        <!-- Password Field -->
        <div>
          <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300 mb-2 login-label-password">
            <i class="fas fa-lock me-2 text-blue-600"></i>Password
          </label>
          <input 
            name="password" 
            type="password"
            placeholder="Enter your password" 
            class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 dark:focus:ring-blue-900 transition bg-gray-50 dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-500 dark:placeholder-gray-400 login-placeholder-password" 
            required
            autocomplete="current-password"
          >
        </div>

        <!-- Login Button -->
        <button 
          type="submit" 
          class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 dark:from-blue-700 dark:to-blue-800 dark:hover:from-blue-800 dark:hover:to-blue-900 text-white font-bold py-3 px-4 rounded-lg transition transform hover:scale-105 active:scale-95 flex items-center justify-center gap-2 shadow-lg login-btn"
        >
          <i class="fas fa-sign-in-alt"></i> <span class="login-btn-text">Login</span>
        </button>
      </form>

      <!-- Footer Text -->
      <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700 text-center">
        <p class="text-gray-600 dark:text-gray-400 text-sm login-footer-text">
          Social Media Management System
        </p>
      </div>
    </div>

    <!-- Alert Container -->
    <div id="alert-box" class="mt-6"></div>

    <!-- Additional Info -->
    <div class="mt-8 text-center text-blue-100 dark:text-gray-500 text-sm fade-in" style="animation-delay: 0.2s;">
      <p class="login-copyright-text">© 2025 All Rights Reserved</p>
    </div>
  </div>

  <!-- JavaScript -->
  <script>
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alert-box');

    // Translations for Login Page
    const loginTranslations = {
      en: {
        'Login': 'Login',
        'SMM Dashboard': 'SMM Dashboard',
        'Username': 'Username',
        'Enter your username': 'Enter your username',
        'Password': 'Password',
        'Enter your password': 'Enter your password',
        'Logging in...': 'Logging in...',
        'Login failed': 'Login failed',
        'Unable to connect to server': 'Unable to connect to server',
        'Login successful!': 'Login successful!',
        'Social Media Management System': 'Social Media Management System',
        '© 2025 All Rights Reserved': '© 2025 All Rights Reserved',
        'Session expired. Please login again.': 'Session expired. Please login again.',
      },
      ar: {
        'Login': 'تسجيل الدخول',
        'SMM Dashboard': 'لوحة تحكم SMM',
        'Username': 'اسم المستخدم',
        'Enter your username': 'أدخل اسم المستخدم',
        'Password': 'كلمة السر',
        'Enter your password': 'أدخل كلمة السر',
        'Logging in...': 'جاري تسجيل الدخول...',
        'Login failed': 'فشل تسجيل الدخول',
        'Unable to connect to server': 'تعذر الاتصال بالخادم',
        'Login successful!': 'تم تسجيل الدخول بنجاح!',
        'Social Media Management System': 'نظام إدارة خدمات وسائل التواصل الاجتماعي',
        '© 2025 All Rights Reserved': '© 2025 جميع الحقوق محفوظة',
        'Session expired. Please login again.': 'انتهت الجلسة. يرجى تسجيل الدخول مرة أخرى.',
      }
    };

    function translateLoginPage(lang) {
      const t = loginTranslations[lang];
      
      // Update text content
      document.querySelector('.login-title').textContent = t['Login'];
      document.querySelector('.login-subtitle').textContent = t['SMM Dashboard'];
      document.querySelector('.login-label-username').lastChild.textContent = t['Username'];
      document.querySelector('.login-label-password').lastChild.textContent = t['Password'];
      document.querySelector('.login-btn-text').textContent = t['Login'];
      document.querySelector('.login-footer-text').textContent = t['Social Media Management System'];
      document.querySelector('.login-copyright-text').textContent = t['© 2025 All Rights Reserved'];
      
      // Update placeholders
      document.querySelector('.login-placeholder-username').placeholder = t['Enter your username'];
      document.querySelector('.login-placeholder-password').placeholder = t['Enter your password'];
    }

    // Initial translation
    translateLoginPage(document.documentElement.lang);

    function show(msg, type = 'error') {
      const lang = document.documentElement.lang;
      const t = loginTranslations[lang];
      
      const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
      
      // Translate messages if they match the English key
      let translatedMsg = t[msg] || msg;

      const alertHTML = `
        <div class="bg-${bgColor} text-white p-4 rounded-lg shadow-lg flex items-center gap-3 animate-pulse">
          <i class="fas ${icon}"></i>
          <span>${translatedMsg}</span>
        </div>
      `;
      alertBox.innerHTML = alertHTML;
      setTimeout(() => alertBox.innerHTML = '', 4000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());
      const lang = document.documentElement.lang;
      const t = loginTranslations[lang];
      
      // Show loading state
      const submitBtn = form.querySelector('button[type="submit"]');
      const originalHTML = submitBtn.innerHTML;
      submitBtn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${t['Logging in...']}`;
      submitBtn.disabled = true;
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: t['Login failed'] }));
          show(err.error || t['Login failed']);
          return;
        }
        
        const j = await res.json();
        localStorage.setItem('authToken', j.token);
        show('Login successful!', 'success');
        
        setTimeout(() => {
          window.location.href = '/admin.html';
        }, 1000);
        
      } catch (err) {
        show('Unable to connect to server');
      } finally {
        submitBtn.innerHTML = originalHTML;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
