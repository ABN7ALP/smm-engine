<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول - لوحة التحكم</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Cairo Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Cairo', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    body.light-mode {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #212529;
    }

    body.dark-mode {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #e0e0e0;
    }

    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 450px;
      animation: slideUp 0.5s ease-in-out;
    }

    body.dark-mode .login-container {
      background: #2a2a2a;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header .logo {
      font-size: 3rem;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0;
      color: #212529;
    }

    body.dark-mode .login-header h1 {
      color: #e0e0e0;
    }

    .login-header p {
      color: #6c757d;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    body.dark-mode .login-header p {
      color: #aaa;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #212529;
      font-size: 0.95rem;
    }

    body.dark-mode .form-label {
      color: #e0e0e0;
    }

    .form-control {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 1rem;
      transition: all 0.3s;
      background-color: #f8f9fa;
      color: #212529;
    }

    body.dark-mode .form-control {
      background-color: #333;
      color: #e0e0e0;
      border-color: #444;
    }

    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
      background-color: white;
    }

    body.dark-mode .form-control:focus {
      background-color: #3a3a3a;
    }

    .form-control::placeholder {
      color: #aaa;
    }

    .input-group-text {
      background-color: transparent;
      border: 2px solid #e0e0e0;
      border-right: none;
      color: #667eea;
    }

    body.dark-mode .input-group-text {
      border-color: #444;
      background-color: #333;
    }

    .input-group .form-control {
      border-left: none;
    }

    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      width: 100%;
      transition: all 0.3s;
      cursor: pointer;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      color: white;
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .alert {
      border: none;
      border-radius: 8px;
      margin-bottom: 20px;
      animation: slideIn 0.3s ease-in-out;
    }

    @keyframes slideIn {
      from {
        transform: translateX(-20px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border-left: 5px solid #dc3545;
    }

    body.dark-mode .alert-danger {
      background-color: #58151c;
      color: #f5c6cb;
      border-left-color: #dc3545;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border-left: 5px solid #28a745;
    }

    body.dark-mode .alert-success {
      background-color: #155724;
      color: #c3e6cb;
      border-left-color: #28a745;
    }

    .login-footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    body.dark-mode .login-footer {
      border-top-color: #444;
    }

    .login-footer p {
      color: #6c757d;
      font-size: 0.9rem;
      margin: 0;
    }

    body.dark-mode .login-footer p {
      color: #aaa;
    }

    .theme-toggle-login {
      position: fixed;
      top: 20px;
      left: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1.3rem;
      color: #667eea;
    }

    body.dark-mode .theme-toggle-login {
      background: #2a2a2a;
      border-color: #444;
      color: #ffc107;
    }

    .theme-toggle-login:hover {
      transform: scale(1.1);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .loading {
      display: none;
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* تنسيقات التسجيل */
    .register-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .register-container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }

    body.dark-mode .register-container {
      background: #2a2a2a;
      color: #e0e0e0;
    }

    .register-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .register-header h3 {
      color: #333;
      margin-bottom: 10px;
    }

    body.dark-mode .register-header h3 {
      color: #e0e0e0;
    }

    .register-header p {
      color: #666;
      font-size: 0.9rem;
    }

    body.dark-mode .register-header p {
      color: #aaa;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }

      .login-header .logo {
        font-size: 2.5rem;
      }

      .register-container {
        padding: 20px;
        margin: 10px;
      }
    }
  </style>
</head>
<body class="light-mode">
  <div class="login-wrapper">
    <div class="login-container">
      <div class="login-header">
        <div class="logo">
          <i class="fas fa-lock"></i>
        </div>
        <h1>لوحة التحكم</h1>
        <p>تسجيل الدخول إلى حسابك</p>
      </div>

      <div id="alert-box"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">
            <i class="fas fa-user"></i> اسم المستخدم
          </label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-user"></i>
            </span>
            <input 
              id="username"
              name="username" 
              type="text"
              class="form-control" 
              placeholder="أدخل اسم المستخدم" 
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fas fa-lock"></i> كلمة السر
          </label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-lock"></i>
            </span>
            <input 
              id="password"
              name="password" 
              type="password"
              class="form-control" 
              placeholder="أدخل كلمة السر" 
              required
              autocomplete="current-password"
            >
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span class="loading">
            <i class="fas fa-spinner fa-spin"></i>
          </span>
          <span class="btn-text">
            <i class="fas fa-sign-in-alt"></i> دخول
          </span>
        </button>
      </form>

      <!-- رابط إنشاء حساب جديد -->
      <div class="text-center mt-4">
        <p class="text-muted mb-2">ليس لديك حساب؟</p>
        <a href="#" id="registerLink" class="btn btn-outline-primary">
          <i class="fas fa-user-plus me-2"></i>إنشاء حساب جديد
        </a>
      </div>

      <div class="login-footer">
        <p>© 2024 لوحة التحكم. جميع الحقوق محفوظة.</p>
      </div>
    </div>
  </div>

  <!-- Theme Toggle Button -->
  <button class="theme-toggle-login" id="themeToggleLogin" title="تبديل الوضع">
    <i class="fas fa-moon"></i>
  </button>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // =================================================================
    //  نظام تسجيل الدخول والتسجيل - الإصدار الكامل
    // =================================================================

    // ========== نظام الثيم (الوضع الفاتح/الداكن) ==========
    const body = document.body;
    const themeToggleLogin = document.getElementById('themeToggleLogin');
    const savedTheme = localStorage.getItem('theme') || 'light';

    // تطبيق الثيم المحفوظ
    body.classList.remove('light-mode', 'dark-mode');
    body.classList.add(savedTheme + '-mode');
    updateThemeIcon();

    // تبديل الثيم
    themeToggleLogin.addEventListener('click', () => {
      const isDark = body.classList.contains('dark-mode');
      body.classList.remove('light-mode', 'dark-mode');
      body.classList.add(isDark ? 'light-mode' : 'dark-mode');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      updateThemeIcon();
    });

    // تحديث أيقونة الثيم
    function updateThemeIcon() {
      const isDark = body.classList.contains('dark-mode');
      themeToggleLogin.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    // ========== نظام تسجيل الدخول ==========
    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = loginForm.querySelector('button[type="submit"]');
    const loadingSpan = submitBtn.querySelector('.loading');
    const btnText = submitBtn.querySelector('.btn-text');

    /**
     * عرض رسالة للمستخدم
     */
    function showAlert(message, type = 'error') {
      const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
      
      alertBox.innerHTML = `
        <div class="alert ${alertClass}" role="alert">
          <i class="fas ${icon}"></i> ${message}
        </div>
      `;
      
      // إزالة الرسالة بعد 4 ثواني
      setTimeout(() => {
        alertBox.innerHTML = '';
      }, 4000);
    }

    /**
     * معالجة تسجيل الدخول
     */
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // تعطيل الزر وإظهار التحميل
      submitBtn.disabled = true;
      loadingSpan.style.display = 'inline';
      btnText.style.display = 'none';

      const formData = new FormData(loginForm);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({ error: 'خطأ في تسجيل الدخول' }));
          showAlert(errorData.error || 'خطأ في تسجيل الدخول', 'error');
          
          // إعادة تفعيل الزر
          submitBtn.disabled = false;
          loadingSpan.style.display = 'none';
          btnText.style.display = 'inline';
          return;
        }

        const result = await response.json();
        showAlert('✅ تم تسجيل الدخول بنجاح', 'success');
        
        // حفظ التوكن والتوجيه
        localStorage.setItem('authToken', result.token);
        
        setTimeout(() => {
          // التوجيه حسب صلاحيات المستخدم
          if (result.role === 'admin') {
            window.location.href = '/admin.html';
          } else {
            window.location.href = '/user.html';
          }
        }, 1000);

      } catch (error) {
        showAlert('❌ تعذر الاتصال بالخادم', 'error');
        submitBtn.disabled = false;
        loadingSpan.style.display = 'none';
        btnText.style.display = 'inline';
      }
    });

    // ========== نظام إنشاء الحساب ==========
    document.getElementById('registerLink').addEventListener('click', function(e) {
      e.preventDefault();
      
      const registerHTML = `
      <div class="register-overlay">
        <div class="register-container">
          <div class="register-header">
            <h3>إنشاء حساب جديد</h3>
            <p>انضم إلينا واستفد من جميع خدماتنا</p>
          </div>
          
          <form id="registerForm">
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">اسم المستخدم *</label>
                  <input type="text" name="username" class="form-control" placeholder="اختر اسم مستخدم فريد" required minlength="3">
                  <div class="form-text">يجب أن يكون 3 أحرف على الأقل</div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">الاسم الكامل</label>
                  <input type="text" name="fullName" class="form-control" placeholder="الاسم الكامل (اختياري)">
                </div>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">البريد الإلكتروني *</label>
              <input type="email" name="email" class="form-control" placeholder="example@email.com" required>
            </div>
            
            <div class="row">
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">كلمة السر *</label>
                  <input type="password" name="password" class="form-control" placeholder="6 أحرف على الأقل" required minlength="6">
                </div>
              </div>
              <div class="col-md-6">
                <div class="mb-3">
                  <label class="form-label">تأكيد كلمة السر *</label>
                  <input type="password" name="confirmPassword" class="form-control" placeholder="أعد إدخال كلمة السر" required>
                </div>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">رقم الهاتف</label>
              <input type="tel" name="phone" class="form-control" placeholder="+963..." pattern="[+][0-9]{10,}">
              <div class="form-text">اختياري - سيستخدم للتواصل معك</div>
            </div>
            
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="agreeTerms" required>
              <label class="form-check-label" for="agreeTerms" style="font-size: 0.9rem;">
                أوافق على <a href="#" style="color: #667eea;">الشروط والأحكام</a> و <a href="#" style="color: #667eea;">سياسة الخصوصية</a>
              </label>
            </div>
            
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary flex-fill" style="padding: 12px;">
                <span class="btn-text">إنشاء الحساب</span>
                <span class="loading" style="display: none;"><i class="fas fa-spinner fa-spin"></i></span>
              </button>
              <button type="button" id="cancelRegister" class="btn btn-secondary">إلغاء</button>
            </div>
          </form>
        </div>
      </div>
      `;
      
      document.body.insertAdjacentHTML('beforeend', registerHTML);
      
      // أحداث نموذج التسجيل
      const registerForm = document.getElementById('registerForm');
      const registerSubmitBtn = registerForm.querySelector('button[type="submit"]');
      const registerBtnText = registerSubmitBtn.querySelector('.btn-text');
      const registerLoading = registerSubmitBtn.querySelector('.loading');
      
      registerForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        // إظهار التحميل
        registerBtnText.style.display = 'none';
        registerLoading.style.display = 'inline-block';
        registerSubmitBtn.disabled = true;
        
        const formData = new FormData(this);
        const data = Object.fromEntries(formData.entries());
        
        // التحقق من تطابق كلمات السر
        if (data.password !== data.confirmPassword) {
          alert('❌ كلمات السر غير متطابقة');
          registerBtnText.style.display = 'inline-block';
          registerLoading.style.display = 'none';
          registerSubmitBtn.disabled = false;
          return;
        }
        
        // تنظيف البيانات قبل الإرسال
        delete data.confirmPassword;
        delete data.agreeTerms;
        
        try {
          const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
          
          const result = await response.json();
          
          if (response.ok) {
            alert('✅ ' + result.message);
            document.querySelector('.register-overlay').remove();
            
            // تعبئة حقول الدخول تلقائياً
            document.getElementById('username').value = data.username;
            document.getElementById('password').value = data.password;
            
          } else {
            alert('❌ ' + (result.error || 'حدث خطأ أثناء إنشاء الحساب'));
          }
        } catch (error) {
          alert('❌ خطأ في الاتصال بالخادم');
        } finally {
          registerBtnText.style.display = 'inline-block';
          registerLoading.style.display = 'none';
          registerSubmitBtn.disabled = false;
        }
      });
      
      // زر الإلغاء
      document.getElementById('cancelRegister').addEventListener('click', function() {
        document.querySelector('.register-overlay').remove();
      });
    });

    // تركيز على حقل اسم المستخدم عند التحميل
    document.getElementById('username').focus();
  </script>
</body>
</html>
