<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول - لوحة التحكم</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Cairo Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Cairo', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    body.light-mode {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #212529;
    }

    body.dark-mode {
      background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
      color: #e0e0e0;
    }

    .login-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 40px;
      width: 100%;
      max-width: 450px;
      animation: slideUp 0.5s ease-in-out;
    }

    body.dark-mode .login-container {
      background: #2a2a2a;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-header .logo {
      font-size: 3rem;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin: 0;
      color: #212529;
    }

    body.dark-mode .login-header h1 {
      color: #e0e0e0;
    }

    .login-header p {
      color: #6c757d;
      margin-top: 8px;
      font-size: 0.95rem;
    }

    body.dark-mode .login-header p {
      color: #aaa;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #212529;
      font-size: 0.95rem;
    }

    body.dark-mode .form-label {
      color: #e0e0e0;
    }

    .form-control {
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 1rem;
      transition: all 0.3s;
      background-color: #f8f9fa;
      color: #212529;
    }

    body.dark-mode .form-control {
      background-color: #333;
      color: #e0e0e0;
      border-color: #444;
    }

    .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
      background-color: white;
    }

    body.dark-mode .form-control:focus {
      background-color: #3a3a3a;
    }

    .form-control::placeholder {
      color: #aaa;
    }

    .input-group-text {
      background-color: transparent;
      border: 2px solid #e0e0e0;
      border-right: none;
      color: #667eea;
    }

    body.dark-mode .input-group-text {
      border-color: #444;
      background-color: #333;
    }

    .input-group .form-control {
      border-left: none;
    }

    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      color: white;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      width: 100%;
      transition: all 0.3s;
      cursor: pointer;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
      color: white;
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .alert {
      border: none;
      border-radius: 8px;
      margin-bottom: 20px;
      animation: slideIn 0.3s ease-in-out;
    }

    @keyframes slideIn {
      from {
        transform: translateX(-20px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .alert-danger {
      background-color: #f8d7da;
      color: #721c24;
      border-left: 5px solid #dc3545;
    }

    body.dark-mode .alert-danger {
      background-color: #58151c;
      color: #f5c6cb;
      border-left-color: #dc3545;
    }

    .alert-success {
      background-color: #d4edda;
      color: #155724;
      border-left: 5px solid #28a745;
    }

    body.dark-mode .alert-success {
      background-color: #155724;
      color: #c3e6cb;
      border-left-color: #28a745;
    }

    .login-footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0e0e0;
    }

    body.dark-mode .login-footer {
      border-top-color: #444;
    }

    .login-footer p {
      color: #6c757d;
      font-size: 0.9rem;
      margin: 0;
    }

    body.dark-mode .login-footer p {
      color: #aaa;
    }

    .theme-toggle-login {
      position: fixed;
      top: 20px;
      left: 20px;
      background: white;
      border: 2px solid #e0e0e0;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 1.3rem;
      color: #667eea;
    }

    body.dark-mode .theme-toggle-login {
      background: #2a2a2a;
      border-color: #444;
      color: #ffc107;
    }

    .theme-toggle-login:hover {
      transform: scale(1.1);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .loading {
      display: none;
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 30px 20px;
      }

      .login-header h1 {
        font-size: 1.5rem;
      }

      .login-header .logo {
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body class="light-mode">
  <div class="login-wrapper">
    <div class="login-container">
      <div class="login-header">
        <div class="logo">
          <i class="fas fa-lock"></i>
        </div>
        <h1>لوحة التحكم</h1>
        <p>تسجيل الدخول إلى حسابك</p>
      </div>

      <div id="alert-box"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="username">
            <i class="fas fa-user"></i> اسم المستخدم
          </label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-user"></i>
            </span>
            <input 
              id="username"
              name="username" 
              type="text"
              class="form-control" 
              placeholder="أدخل اسم المستخدم" 
              required
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fas fa-lock"></i> كلمة السر
          </label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fas fa-lock"></i>
            </span>
            <input 
              id="password"
              name="password" 
              type="password"
              class="form-control" 
              placeholder="أدخل كلمة السر" 
              required
              autocomplete="current-password"
            >
          </div>
        </div>

        <button type="submit" class="btn-login">
          <span class="loading">
            <i class="fas fa-spinner fa-spin"></i>
          </span>
          <span class="btn-text">
            <i class="fas fa-sign-in-alt"></i> دخول
          </span>
        </button>
      </form>

      // ⬇️ أضف كود التسجيل الجديد هنا
document.getElementById('registerLink').addEventListener('click', function(e) {
    e.preventDefault();
    
    const registerHTML = `
    <div class="register-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000;">
        <div class="register-container" style="background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto;">
            <div class="register-header" style="text-align: center; margin-bottom: 25px;">
                <h3 style="color: #333; margin-bottom: 10px;">إنشاء حساب جديد</h3>
                <p style="color: #666; font-size: 0.9rem;">انضم إلينا واستفد من جميع خدماتنا</p>
            </div>
            
            <form id="registerForm">
                <!-- ... كود النموذج الكامل ... -->
            </form>
        </div>
    </div>
    `;

      <div class="login-footer">
        <p>© 2024 لوحة التحكم. جميع الحقوق محفوظة.</p>
      </div>
    </div>
  </div>

  <!-- Theme Toggle Button -->
  <button class="theme-toggle-login" id="themeToggleLogin" title="تبديل الوضع">
    <i class="fas fa-moon"></i>
  </button>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ========== THEME TOGGLE ==========
    const themeToggleLogin = document.getElementById('themeToggleLogin');
    const body = document.body;
    const savedTheme = localStorage.getItem('theme') || 'light';

    body.classList.remove('light-mode', 'dark-mode');
    body.classList.add(savedTheme + '-mode');
    updateThemeIcon();

    themeToggleLogin.addEventListener('click', () => {
      const isDark = body.classList.contains('dark-mode');
      body.classList.remove('light-mode', 'dark-mode');
      body.classList.add(isDark ? 'light-mode' : 'dark-mode');
      localStorage.setItem('theme', isDark ? 'light' : 'dark');
      updateThemeIcon();
    });

    function updateThemeIcon() {
      const isDark = body.classList.contains('dark-mode');
      themeToggleLogin.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    // ========== LOGIN FORM ==========
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alert-box');
    const submitBtn = form.querySelector('button[type="submit"]');
    const loadingSpan = submitBtn.querySelector('.loading');
    const btnText = submitBtn.querySelector('.btn-text');

    function show(msg, type = 'error') {
      const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
      const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
      alertBox.innerHTML = `
        <div class="alert ${alertClass}" role="alert">
          <i class="fas ${icon}"></i> ${msg}
        </div>
      `;
      setTimeout(() => {
        alertBox.innerHTML = '';
      }, 4000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      // Disable button and show loading
      submitBtn.disabled = true;
      loadingSpan.style.display = 'inline';
      btnText.style.display = 'none';

      const fd = new FormData(form);
      const data = Object.fromEntries(fd.entries());

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: 'خطأ في تسجيل الدخول' }));
          show(err.error || 'خطأ في تسجيل الدخول', 'error');
          submitBtn.disabled = false;
          loadingSpan.style.display = 'none';
          btnText.style.display = 'inline';
          return;
        }

        const j = await res.json();
        localStorage.setItem('authToken', j.token);
        show('✅ تم تسجيل الدخول بنجاح', 'success');
        
        setTimeout(() => {
          window.location.href = '/admin.html';
        }, 1000);
      } catch (err) {
        show('تعذر الاتصال بالخادم', 'error');
        submitBtn.disabled = false;
        loadingSpan.style.display = 'none';
        btnText.style.display = 'inline';
      }
    });

    // Focus on first input
    document.getElementById('username').focus();
  </script>
</body>
</html>
