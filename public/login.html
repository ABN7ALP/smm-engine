<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول - لوحة التحكم</title>

  <!-- Cairo Font -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style-modern.css">
  <script src="theme-toggle.js" defer></script>

</head>
<body class="login-page">
  <div class="login-container fade-in">
    <div class="login-header">
      <h1>تسجيل الدخول</h1>
      <p class="login-subtitle">لوحة تحكم SMM</p>
    </div>
    
    <div class="login-card">
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">
            <i class="fas fa-user"></i> اسم المستخدم
          </label>
          <input name="username" class="form-control" placeholder="أدخل اسم المستخدم" required>
        </div>
        <div class="form-group">
          <label class="form-label">
            <i class="fas fa-lock"></i> كلمة السر
          </label>
          <input name="password" type="password" class="form-control" placeholder="أدخل كلمة السر" required>
        </div>
        <button type="submit" class="login-btn">
          <i class="fas fa-sign-in-alt"></i> دخول
        </button>
      </form>
      
      <div class="login-footer">
        <p>نظام إدارة خدمات وسائل التواصل الاجتماعي</p>
      </div>
    </div>
    
    <div class="alert-container" id="alert-box"></div>
  </div>

<script>
const form = document.getElementById('loginForm');
const alertBox = document.getElementById('alert-box');

function show(msg, type = 'error') {
  const alertClass = type === 'success' ? 'alert-success' : 'alert-danger';
  alertBox.innerHTML = `<div class="alert ${alertClass}">${msg}</div>`;
  setTimeout(() => alertBox.innerHTML = '', 4000);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(form);
  const data = Object.fromEntries(fd.entries());
  
  // إظهار حالة التحميل
  const submitBtn = form.querySelector('.login-btn');
  const originalText = submitBtn.innerHTML;
  submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري تسجيل الدخول...';
  submitBtn.disabled = true;
  
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    
    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: 'خطأ في تسجيل الدخول' }));
      show(err.error || 'خطأ في تسجيل الدخول');
      return;
    }
    
    const j = await res.json();
    localStorage.setItem('authToken', j.token);
    show('تم تسجيل الدخول بنجاح!', 'success');
    
    setTimeout(() => {
      window.location.href = '/admin.html';
    }, 1000);
    
  } catch (err) {
    show('تعذر الاتصال بالخادم');
  } finally {
    submitBtn.innerHTML = originalText;
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
