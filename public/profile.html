<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - SMM Engine</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00b4d8;
            margin-bottom: 10px;
        }

        .card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }

        .card-header i {
            color: #00b4d8;
            margin-left: 10px;
            font-size: 1.2rem;
        }

        .card-header h2 {
            color: #f8fafc;
            font-size: 1.3rem;
        }

        /* الملف الشخصي */
        .profile-section {
            text-align: center;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #00b4d8;
            margin: 0 auto 15px;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-username {
            color: #94a3b8;
            margin-bottom: 15px;
        }

        .profile-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .stat {
            text-align: center;
            padding: 15px;
            background: rgba(0, 180, 216, 0.1);
            border-radius: 10px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00b4d8;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* النماذج */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #f8fafc;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: none;
            border-color: #00b4d8;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 25px;
            background: linear-gradient(135deg, #00b4d8 0%, #6c7ae0 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 180, 216, 0.4);
        }

        .btn i {
            margin-left: 8px;
        }

        .btn-block {
            width: 100%;
        }

        /* التنبيهات */
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid #10b981;
            color: #10b981;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        /* القوائم */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
        }

        .tab {
            padding: 12px 25px;
            background: transparent;
            border: none;
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: rgba(0, 180, 216, 0.1);
            color: #00b4d8;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الطلبات */
        .orders-grid {
            display: grid;
            gap: 15px;
        }

        .order-item {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 20px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .order-id {
            color: #00b4d8;
            font-weight: bold;
        }

        .order-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-pending { background: #f59e0b; color: white; }
        .status-processing { background: #00b4d8; color: white; }
        .status-completed { background: #10b981; color: white; }
        .status-rejected { background: #ef4444; color: white; }

        .order-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .profile-stats {
                grid-template-columns: 1fr;
            }
            
            .order-details {
                grid-template-columns: 1fr;
            }
            
            .nav-tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- التنبيهات -->
        <div id="alert" class="alert"></div>

        <!-- الرأس -->
        <div class="header">
            <h1><i class="fas fa-user-circle"></i> الملف الشخصي</h1>
            <p>إدارة حسابك ومتابعة طلباتك</p>
        </div>

        <!-- التبويبات -->
        <div class="nav-tabs">
            <button class="tab active" onclick="showSection('profile')">الملف الشخصي</button>
            <button class="tab" onclick="showSection('orders')">طلباتي</button>
            <button class="tab" onclick="showSection('security')">الأمان</button>
            <button class="tab" onclick="showSection('deposit')">شحن الرصيد</button>
        </div>

        <!-- قسم الملف الشخصي -->
        <div class="content-section active" id="profile-section">
            <div class="card">
                <div class="profile-section">
                    <img src="/assets/default-avatar.png" alt="الصورة الشخصية" class="avatar" id="avatar">
                    <div class="profile-name" id="fullName">جاري التحميل...</div>
                    <div class="profile-username" id="username">@username</div>
                    
                    <div class="profile-stats">
                        <div class="stat">
                            <div class="stat-value" id="balance">$0.00</div>
                            <div class="stat-label">الرصيد</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="totalOrders">0</div>
                            <div class="stat-label">الطلبات</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" id="completedOrders">0</div>
                            <div class="stat-label">مكتملة</div>
                        </div>
                    </div>

                    <button class="btn" onclick="refreshData()">
                        <i class="fas fa-sync-alt"></i> تحديث البيانات
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <i class="fas fa-user-edit"></i>
                    <h2>تعديل المعلومات</h2>
                </div>
                
                <form id="profileForm">
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل</label>
                        <input type="text" class="form-control" id="editFullName" placeholder="أدخل اسمك الكامل">
                    </div>
                    <div class="form-group">
                        <label class="form-label">رقم الهاتف</label>
                        <input type="tel" class="form-control" id="editPhone" placeholder="+966 5X XXX XXXX">
                    </div>
                    <button type="submit" class="btn btn-block">
                        <i class="fas fa-save"></i> حفظ التغييرات
                    </button>
                </form>
            </div>
        </div>

        <!-- قسم الطلبات -->
        <div class="content-section" id="orders-section">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-shopping-cart"></i>
                    <h2>طلباتي</h2>
                    <button class="btn" onclick="loadOrders()" style="margin-right: auto;">
                        <i class="fas fa-redo"></i> تحديث
                    </button>
                </div>
                
                <div id="ordersList">
                    <div style="text-align: center; padding: 40px; color: #94a3b8;">
                        <i class="fas fa-shopping-cart fa-2x" style="margin-bottom: 15px;"></i>
                        <p>جاري تحميل الطلبات...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- قسم الأمان -->
        <div class="content-section" id="security-section">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-shield-alt"></i>
                    <h2>تغيير كلمة السر</h2>
                </div>
                
                <form id="securityForm">
                    <div class="form-group">
                        <label class="form-label">كلمة السر الحالية</label>
                        <input type="password" class="form-control" id="currentPassword" placeholder="أدخل كلمة السر الحالية">
                    </div>
                    <div class="form-group">
                        <label class="form-label">كلمة السر الجديدة</label>
                        <input type="password" class="form-control" id="newPassword" placeholder="كلمة السر الجديدة">
                    </div>
                    <div class="form-group">
                        <label class="form-label">تأكيد كلمة السر</label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="أعد إدخال كلمة السر الجديدة">
                    </div>
                    <button type="submit" class="btn btn-block">
                        <i class="fas fa-key"></i> تغيير كلمة السر
                    </button>
                </form>
            </div>
        </div>

        <!-- قسم شحن الرصيد -->
        <div class="content-section" id="deposit-section">
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-wallet"></i>
                    <h2>شحن الرصيد</h2>
                </div>
                
                <form id="depositForm">
                    <div class="form-group">
                        <label class="form-label">المبلغ ($)</label>
                        <input type="number" class="form-control" id="amount" placeholder="0.00" min="1" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="form-label">طريقة الدفع</label>
                        <select class="form-control" id="paymentMethod">
                            <option value="">اختر طريقة الدفع</option>
                            <option value="bank">تحويل بنكي</option>
                            <option value="sham">شام</option>
                            <option value="transfer">حوالة مالية</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-block">
                        <i class="fas fa-paper-plane"></i> طلب الشحن
                    </button>
                </form>
            </div>
        </div>

        <!-- الروابط السريعة -->
        <div style="text-align: center; margin-top: 30px;">
            <a href="/user.html" class="btn" style="background: #6c7ae0;">
                <i class="fas fa-arrow-right"></i> العودة للرئيسية
            </a>
            <button class="btn" onclick="logout()" style="background: #ef4444; margin-right: 10px;">
                <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
            </button>
        </div>
    </div>

    <script>
        // =========================================================
        //  نظام البروفايل البسيط - بدون تعقيد
        // =========================================================

        const token = localStorage.getItem('authToken');
        if (!token) {
            window.location.href = '/login.html';
        }

        const headers = {
            'Content-Type': 'application/json',
            'x-auth-token': token
        };

        // دوال التنقل
        function showSection(sectionName) {
            // إخفاء جميع الأقسام
            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // إظهار القسم المطلوب
            document.getElementById(sectionName + '-section').classList.add('active');
            
            // تحديث التبويبات
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');

            // تحميل البيانات حسب القسم
            if (sectionName === 'orders') {
                loadOrders();
            }
        }

        // دوال التنبيهات
        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.innerHTML = `<i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}-circle"></i> ${message}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        // تحميل بيانات المستخدم
        async function loadUserData() {
            try {
                console.log('🔄 جاري تحميل بيانات المستخدم...');
                
                const response = await fetch('/api/user/profile', { headers });
                
                if (!response.ok) {
                    throw new Error('فشل تحميل البيانات');
                }

                const userData = await response.json();
                
                // تحديث الواجهة
                document.getElementById('fullName').textContent = userData.fullName || userData.username;
                document.getElementById('username').textContent = '@' + userData.username;
                document.getElementById('balance').textContent = '$' + (userData.balance || 0).toFixed(2);
                document.getElementById('editFullName').value = userData.fullName || '';
                document.getElementById('editPhone').value = userData.phone || '';
                
                if (userData.avatar && userData.avatar !== '/assets/default-avatar.png') {
                    document.getElementById('avatar').src = userData.avatar;
                }
                
                console.log('✅ تم تحميل بيانات المستخدم');
                
            } catch (error) {
                console.error('❌ خطأ في تحميل البيانات:', error);
                showAlert('❌ فشل تحميل البيانات', 'error');
            }
        }

        // تحميل الطلبات
        async function loadOrders() {
            try {
                console.log('🔄 جاري تحميل الطلبات...');
                
                const response = await fetch('/api/user/orders', { headers });
                
                if (!response.ok) {
                    throw new Error('فشل تحميل الطلبات');
                }

                const orders = await response.json();
                
                if (!Array.isArray(orders)) {
                    throw new Error('بيانات الطلبات غير صالحة');
                }

                displayOrders(orders);
                updateOrderStats(orders);
                
                console.log(`✅ تم تحميل ${orders.length} طلب`);
                
            } catch (error) {
                console.error('❌ خطأ في تحميل الطلبات:', error);
                document.getElementById('ordersList').innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #ef4444;">
                        <i class="fas fa-exclamation-circle fa-2x" style="margin-bottom: 15px;"></i>
                        <p>فشل تحميل الطلبات</p>
                        <p style="font-size: 0.9rem; margin-top: 10px;">${error.message}</p>
                    </div>
                `;
            }
        }

        // عرض الطلبات
        function displayOrders(orders) {
            const container = document.getElementById('ordersList');
            
            if (orders.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: #94a3b8;">
                        <i class="fas fa-shopping-cart fa-2x" style="margin-bottom: 15px;"></i>
                        <p>لا توجد طلبات</p>
                        <p style="font-size: 0.9rem; margin-top: 10px;">لم تقم بأي طلبات حتى الآن</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = orders.map(order => {
                const date = new Date(order.createdAt).toLocaleDateString('en-US');
                const statusClass = `status-${order.status}`;
                const statusText = getStatusText(order.status);
                
                return `
                <div class="order-item">
                    <div class="order-header">
                        <div class="order-id">طلب #${order.id}</div>
                        <div class="order-status ${statusClass}">${statusText}</div>
                    </div>
                    <div class="order-details">
                        <div>
                            <strong>الرابط:</strong>
                            <div style="margin-top: 5px;">
                                <a href="${order.link}" target="_blank" style="color: #00b4d8; word-break: break-all;">${order.link}</a>
                            </div>
                        </div>
                        <div>
                            <strong>التكلفة:</strong>
                            <div style="margin-top: 5px; color: #00b4d8; font-weight: bold;">$${order.price?.toFixed(2) || '0.00'}</div>
                        </div>
                    </div>
                    <div style="margin-top: 10px; color: #94a3b8; font-size: 0.9rem;">
                        <strong>التاريخ:</strong> ${date} | <strong>الخدمة:</strong> ${order.serviceId}
                    </div>
                </div>
                `;
            }).join('');
        }

        // تحديث إحصائيات الطلبات
        function updateOrderStats(orders) {
            const total = orders.length;
            const completed = orders.filter(order => order.status === 'completed').length;
            
            document.getElementById('totalOrders').textContent = total;
            document.getElementById('completedOrders').textContent = completed;
        }

        // دوال مساعدة
        function getStatusText(status) {
            const statusMap = {
                'pending': '⏳ قيد الانتظار',
                'processing': '⚙️ قيد التنفيذ',
                'completed': '✅ مكتمل',
                'rejected': '❌ مرفوض'
            };
            return statusMap[status] || status;
        }

        function refreshData() {
            loadUserData();
            loadOrders();
            showAlert('✅ تم تحديث البيانات', 'success');
        }

        function logout() {
            if (confirm('هل أنت متأكد من تسجيل الخروج؟')) {
                localStorage.removeItem('authToken');
                window.location.href = '/login.html';
            }
        }

        // المستمعين للأحداث
        document.getElementById('profileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                fullName: document.getElementById('editFullName').value,
                phone: document.getElementById('editPhone').value
            };

            try {
                const response = await fetch('/api/user/profile', {
                    method: 'PUT',
                    headers,
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showAlert('✅ تم تحديث الملف الشخصي', 'success');
                    loadUserData();
                } else {
                    throw new Error('فشل تحديث البيانات');
                }
            } catch (error) {
                showAlert('❌ فشل تحديث البيانات', 'error');
            }
        });

        document.getElementById('depositForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = document.getElementById('amount').value;
            const method = document.getElementById('paymentMethod').value;

            if (!amount || amount <= 0) {
                showAlert('❌ الرجاء إدخال مبلغ صحيح', 'error');
                return;
            }

            if (!method) {
                showAlert('❌ الرجاء اختيار طريقة الدفع', 'error');
                return;
            }

            try {
                const response = await fetch('/api/user/deposit', {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({ amount, method })
                });

                if (response.ok) {
                    showAlert('✅ تم إرسال طلب الشحن بنجاح', 'success');
                    e.target.reset();
                    loadUserData();
                } else {
                    throw new Error('فشل إرسال طلب الشحن');
                }
            } catch (error) {
                showAlert('❌ فشل إرسال طلب الشحن', 'error');
            }
        });

        // التهيئة
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 بدء تحميل البروفايل البسيط...');
            loadUserData();
            
            // تحميل الطلبات بعد 2 ثانية
            setTimeout(loadOrders, 2000);
        });

        console.log('✅ البروفايل البسيط جاهز للعمل!');
    </script>
</body>
</html>
