<!doctype html>

<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الملف الشخصي — لوحة التحكم</title>
  <!-- Fonts & icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-jQk6f+Z6Y..." crossorigin="anonymous" referrerpolicy="no-referrer" />  <style>
    /* ====== Reset & base ====== */
    :root{
      --bg: #0f1724; /* deep navy */
      --card: #0b1220;
      --muted: #98a0b3;
      --accent: #00b4d8; /* cyan accent */
      --accent-2: #6c7ae0; /* secondary */
      --glass: rgba(255,255,255,0.04);
      --success: #28c76f;
      --danger: #ff6b6b;
      --radius: 14px;
      --fw-regular: 400;
      --fw-medium: 600;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial; background: linear-gradient(180deg,#061223 0%, #071427 60%);color:#e6eef8}
    img{max-width:100%;display:block}

    /* ====== Layout ====== */
    .container{max-width:1100px;margin:40px auto;padding:24px}
    .grid{display:grid;gap:18px}
    .grid-3{grid-template-columns:320px 1fr 320px}
    @media (max-width:1000px){.grid-3{grid-template-columns:1fr;}}

    /* ====== Sidebar Card ====== */
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:var(--radius);padding:20px;box-shadow:0 6px 30px rgba(2,6,23,0.6);border:1px solid rgba(255,255,255,0.03)}
    .profile-header{display:flex;gap:16px;align-items:center}
    .avatar{width:92px;height:92px;border-radius:18px;overflow:hidden;border:2px solid rgba(255,255,255,0.06);flex-shrink:0}
    .avatar img{width:100%;height:100%;object-fit:cover}
    .user-meta h2{margin:0;font-size:20px;font-weight:800}
    .user-meta p{margin:6px 0 0;color:var(--muted);font-size:13px}
    .badge{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:600;font-size:12px}

    /* ====== Stats ====== */
    .stats{display:flex;gap:12px;margin-top:18px}
    .stat{flex:1;background:var(--glass);padding:12px;border-radius:12px;text-align:center}
    .stat h3{margin:0;font-size:18px}
    .stat p{margin:6px 0 0;color:var(--muted);font-size:12px}

    /* ====== Main content ====== */
    .panel-title{display:flex;justify-content:space-between;align-items:center}
    .panel-title h3{margin:0;font-size:18px}
    .panel{padding:18px}
    .tabs{display:flex;gap:8px;margin:16px 0}
    .tab{background:transparent;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer}
    .tab.active{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#061427;box-shadow:0 6px 24px rgba(92,132,255,0.12)}

    /* ====== Forms ====== */
    form .row{display:flex;gap:12px;flex-wrap:wrap}
    .form-control{background:transparent;border:1px solid rgba(255,255,255,0.06);padding:12px 14px;border-radius:10px;color:#e6eef8;min-width:0}
    label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:10px;border:none;cursor:pointer;font-weight:700}
    .btn-primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#061427}
    .btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.04);color:var(--muted)}
    .small{font-size:13px;color:var(--muted)}

    /* ====== Right column (activity) ====== */
    .transactions .item{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));padding:12px;border-radius:10px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.03)}
    .transactions .item .row{display:flex;justify-content:space-between;align-items:center}
    .muted{color:var(--muted)}

    /* ====== Utilities ====== */
    .divider{height:1px;background:linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);margin:14px 0;border-radius:2px}
    .text-right{text-align:right}

    /* ====== Small screens adjustments ====== */
    @media (max-width:600px){
      .avatar{width:72px;height:72px}
      .grid{padding:0 8px}
    }

    /* ====== Accessibility focus ====== */
    .tab:focus, .btn:focus, .form-control:focus{outline:3px solid rgba(0,180,216,0.12);outline-offset:2px}

  </style></head>
<body>  <div class="container">
    <div class="grid grid-3">
      <!-- LEFT: profile summary -->
      <aside class="card">
        <div class="profile-header">
          <div class="avatar" id="avatarPreview">
            <img src="/assets/images/default-avatar.jpg" alt="صورة المستخدم" id="userAvatar">
          </div>
          <div class="user-meta">
            <h2 id="userFullName">اسم المستخدم</h2>
            <p id="userUsername">@username</p>
            <div style="margin-top:8px">
              <span class="badge" id="userStatus">نشط</span>
            </div>
          </div>
        </div><div class="stats" aria-hidden="false">
      <div class="stat" title="الرصيد">
        <h3 id="userBalance">0.00 TL</h3>
        <p>الرصيد</p>
      </div>
      <div class="stat" title="الطلبات">
        <h3 id="totalOrders">0</h3>
        <p>الطلبات</p>
      </div>
      <div class="stat" title="مكتمل">
        <h3 id="completedOrders">0</h3>
        <p>مكتمل</p>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <label class="small">رفع صورة الحساب</label>
      <input type="file" id="avatarUpload" accept="image/*" class="form-control">
    </div>

    <div class="divider"></div>

    <div>
      <button class="btn btn-primary" id="editProfileBtn">تعديل الملف</button>
      <button class="btn btn-ghost" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </aside>

  <!-- MIDDLE: main panels -->
  <main>
    <div class="card panel">
      <div class="panel-title">
        <h3>لوحة الملف الشخصي</h3>
        <div class="small muted">مرحبًا — عدّل بياناتك بأمان. كل التغييرات تُحفظ على السيرفر.</div>
      </div>

      <div class="tabs" role="tablist" aria-label="تبويبات الملف">
        <div class="tab active" role="tab" tabindex="0" data-tab="account">الحساب</div>
        <div class="tab" role="tab" tabindex="0" data-tab="security">الأمان</div>
        <div class="tab" role="tab" tabindex="0" data-tab="payments">الشحن</div>
      </div>

      <section id="account-tab" class="tab-pane" style="display:block">
        <form id="profileForm" autocomplete="off">
          <div class="row">
            <div style="flex:1">
              <label>الاسم الكامل</label>
              <input name="fullName" type="text" class="form-control" placeholder="ادخل اسمك الكامل" required>
            </div>
            <div style="width:220px">
              <label>الهاتف</label>
              <input name="phone" type="text" class="form-control" placeholder="05xxxxxxxx" required>
            </div>
          </div>

          <div style="margin-top:12px">
            <label>البريد الإلكتروني</label>
            <input name="email" type="email" class="form-control" placeholder="you@example.com">
          </div>

          <div style="display:flex;gap:12px;margin-top:14px;align-items:center">
            <button class="btn btn-primary" type="submit"><span class="btn-text">حفظ التعديلات</span></button>
            <button class="btn btn-ghost" type="button" id="cancelEdit">إلغاء</button>
          </div>
        </form>
      </section>

      <section id="security-tab" class="tab-pane" style="display:none">
        <form id="changePasswordForm" autocomplete="off">
          <div style="margin-bottom:12px">
            <label>كلمة السر الحالية</label>
            <input name="currentPassword" type="password" class="form-control" required>
          </div>
          <div class="row">
            <div style="flex:1">
              <label>كلمة السر الجديدة</label>
              <input name="newPassword" type="password" class="form-control" required>
            </div>
            <div style="width:220px">
              <label>تأكيد كلمة السر</label>
              <input name="confirmPassword" type="password" class="form-control" required>
            </div>
          </div>
          <div style="display:flex;gap:12px;margin-top:14px;align-items:center">
            <button class="btn btn-primary" type="submit"><span class="btn-text">تغيير كلمة السر</span></button>
            <button class="btn btn-ghost" type="button" id="resetPwd">إعادة تعيين</button>
          </div>
        </form>
      </section>

      <section id="payments-tab" class="tab-pane" style="display:none">
        <form id="depositForm" autocomplete="off">
          <div style="margin-bottom:12px">
            <label>المبلغ (TL)</label>
            <input name="amount" type="number" min="1" class="form-control" placeholder="مثال: 150" required>
          </div>
          <div style="margin-bottom:12px">
            <label>طريقة الدفع</label>
            <select name="method" class="form-control">
              <option value="bank">حوالة بنكية</option>
              <option value="card">بطاقة ائتمان</option>
              <option value="cash">نقداً</option>
            </select>
          </div>
          <div style="display:flex;gap:12px;margin-top:14px;align-items:center">
            <button class="btn btn-primary" type="submit"><span class="btn-text">أرسل طلب الشحن</span></button>
            <button class="btn btn-ghost" type="button" id="viewPaymentDetails">تفاصيل الحساب</button>
          </div>
        </form>
      </section>

    </div>

    <div class="card" style="margin-top:16px">
      <div class="panel-title"><h3>ملخص النشاط</h3><div class="small muted">آخر العمليات</div></div>
      <div class="divider"></div>
      <div id="transactionsList" class="transactions">
        <!-- items injected by JS -->
        <div class="muted">لا توجد معاملات حالياً</div>
      </div>
    </div>
  </main>

  <!-- RIGHT: quick actions & details -->
  <aside class="card">
    <h4 style="margin-top:0">تفاصيل الحساب</h4>
    <div class="small muted">تاريخ التسجيل: <span id="memberSince">--</span></div>
    <div class="divider"></div>

    <div style="margin-bottom:12px">
      <label class="small">حالة الحساب</label>
      <div><span class="badge" id="planBadge">مجاني</span></div>
    </div>

    <div class="divider"></div>

    <div>
      <h5 style="margin:0 0 8px 0">روابط سريعة</h5>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
        <a class="btn btn-ghost" href="/orders">الطلبات</a>
        <a class="btn btn-ghost" href="/settings">الإعدادات</a>
        <a class="btn btn-ghost" href="/support">الدعم</a>
      </div>
    </div>
  </aside>

</div>

  </div>  <!-- Inline JS: minimal controls - keep your existing JS here if needed -->  <script>
    (function(){
      'use strict';
      // Tabs
      const tabs = Array.from(document.querySelectorAll('.tab'));
      function activate(name){
        tabs.forEach(t=> t.classList.toggle('active', t.getAttribute('data-tab')===name));
        document.querySelectorAll('.tab-pane').forEach(p=> p.style.display = 'none');
        const el = document.getElementById(name + '-tab');
        if(el) el.style.display = 'block';
      }
      tabs.forEach(t=> t.addEventListener('click', ()=> activate(t.getAttribute('data-tab'))));
      tabs.forEach(t=> t.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') activate(t.getAttribute('data-tab')); }));

      // Avatar preview
      const avatarInput = document.getElementById('avatarUpload');
      const avatarImg = document.getElementById('userAvatar');
      if(avatarInput){
        avatarInput.addEventListener('change', (e)=>{
          const file = e.target.files && e.target.files[0];
          if(!file) return;
          if(file.size > 5*1024*1024){ alert('حجم الصورة أكبر من 5MB'); return; }
          const url = URL.createObjectURL(file);
          avatarImg.src = url;
        })
      }

      // Simple graceful form handlers (no server calls here) - keep your server logic intact
      document.getElementById('profileForm').addEventListener('submit', function(e){ e.preventDefault(); alert('طلب حفظ التعديلات (تمت محاكاة الارسال)'); });
      document.getElementById('changePasswordForm').addEventListener('submit', function(e){ e.preventDefault(); alert('طلب تغيير كلمة السر (محاكاة)'); });
      document.getElementById('depositForm').addEventListener('submit', function(e){ e.preventDefault(); alert('طلب شحن (محاكاة)'); });

      // Replace these simulated loads with your real API response handling
      // Example: populate user details if you have a global user object
      if(window.__USERDATA){
        document.getElementById('userFullName').textContent = window.__USERDATA.fullName || 'اسم المستخدم';
        document.getElementById('userUsername').textContent = '@' + (window.__USERDATA.username || 'user');
        if(window.__USERDATA.avatar) document.getElementById('userAvatar').src = window.__USERDATA.avatar;
        if(window.__USERDATA.balance) document.getElementById('userBalance').textContent = (Number(window.__USERDATA.balance).toFixed(2)) + ' TL';
        if(window.__USERDATA.createdAt) document.getElementById('memberSince').textContent = new Date(window.__USERDATA.createdAt).toLocaleDateString('ar-SA');
      }

    })();
  </script></body>
</html>
