<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>الملف الشخصي - SMM Engine</title>
  
  <!-- المكتبات -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --accent: #00b4d8;
      --accent-2: #6c7ae0;
      --card: #1e293b;
      --bg-dark: #0f172a;
      --bg-darker: #020617;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: 300px 1fr 280px;
      gap: 24px;
      align-items: start;
    }

    /* البطاقات العامة */
    .card {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: between;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .card-header h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
    }

    .card-header i {
      color: var(--accent);
      margin-left: 8px;
    }

    /* بطاقة الملف الشخصي */
    .profile-card {
      position: sticky;
      top: 40px;
    }

    .profile-avatar {
      text-align: center;
      margin-bottom: 24px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid var(--accent);
      object-fit: cover;
      margin-bottom: 16px;
    }

    .profile-name {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .profile-username {
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .profile-status {
      display: inline-flex;
      align-items: center;
      background: var(--success);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .profile-stats {
      display: grid;
      gap: 16px;
      margin: 24px 0;
    }

    .stat-item {
      display: flex;
      justify-content: between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .stat-item:last-child {
      border-bottom: none;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.875rem;
    }

    .stat-value {
      font-weight: 600;
      color: var(--accent);
    }

    /* القائمة الجانبية */
    .side-nav {
      position: sticky;
      top: 40px;
    }

    .nav-section {
      margin-bottom: 24px;
    }

    .nav-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-link {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 8px;
      transition: all 0.2s ease;
      margin-bottom: 4px;
    }

    .nav-link:hover, .nav-link.active {
      background: rgba(0, 180, 216, 0.1);
      color: var(--accent);
    }

    .nav-link i {
      margin-left: 12px;
      width: 20px;
      text-align: center;
    }

    /* المحتوى الرئيسي */
    .main-content {
      min-height: 600px;
    }

    .content-section {
      display: none;
    }

    .content-section.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* النماذج */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-weight: 500;
      margin-bottom: 8px;
      color: var(--text);
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.875rem;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 180, 216, 0.1);
    }

    .form-control:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* الأزرار */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn i {
      margin-left: 8px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 180, 216, 0.3);
    }

    .btn-block {
      width: 100%;
    }

    /* قائمة المعاملات */
    .transaction-list {
      max-height: 500px;
      overflow-y: auto;
    }

    .transaction-item {
      display: flex;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 12px;
      transition: all 0.2s ease;
    }

    .transaction-item:hover {
      border-color: var(--accent);
      transform: translateX(-2px);
    }

    .transaction-icon {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 16px;
      background: rgba(0, 180, 216, 0.1);
      color: var(--accent);
    }

    .transaction-details {
      flex: 1;
    }

    .transaction-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .transaction-meta {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .transaction-amount {
      font-weight: 700;
      color: var(--success);
    }

    /* التبويبات */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .tab {
      padding: 12px 24px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }

    .tab:hover {
      background: rgba(0, 180, 216, 0.1);
      color: var(--accent);
    }

    .tab.active {
      background: rgba(0, 180, 216, 0.1);
      color: var(--accent);
    }

    /* التنبيهات */
    .alert {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 1px solid transparent;
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.1);
      border-color: var(--success);
      color: var(--success);
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border-color: var(--danger);
      color: var(--danger);
    }

    /* الاستجابة للشاشات الصغيرة */
    @media (max-width: 1200px) {
      .container {
        grid-template-columns: 280px 1fr;
      }
      
      .side-nav {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
        padding: 20px 16px;
      }
      
      .form-grid {
        grid-template-columns: 1fr;
      }
      
      .profile-card {
        position: static;
      }
      
      .tabs {
        flex-direction: column;
      }
      
      .tab {
        text-align: right;
      }
    }

    /* شريط التمرير المخصص */
    .transaction-list::-webkit-scrollbar {
      width: 6px;
    }

    .transaction-list::-webkit-scrollbar-track {
      background: var(--border);
      border-radius: 3px;
    }

    .transaction-list::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 3px;
    }
  </style>
</head>

  <script>
    
      
      // =================================================================
//  نظام الملف الشخصي - النسخة المعدلة (بيانات حقيقية)
// =================================================================

let userData = {};
const headers = {
    'Content-Type': 'application/json',
    'x-auth-token': localStorage.getItem('authToken')
};

// التحقق من صحة الجلسة
if (!headers['x-auth-token']) {
    window.location.href = '/login.html';
}

// دوال التنقل
function showSection(sectionName) {
    // إخفاء جميع الأقسام
    document.querySelectorAll('.content-section').forEach(section => {
        section.classList.remove('active');
    });
    
    // إظهار القسم المطلوب
    const targetSection = document.getElementById(sectionName + '-section');
    if (targetSection) {
        targetSection.classList.add('active');
    }
    
    // تحديث التبويبات النشطة
    document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
    });
    
    document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.remove('active');
    });
    
    // إضافة النشاط للعناصر المحددة
    const activeTab = Array.from(document.querySelectorAll('.tab')).find(tab => 
        tab.textContent.includes(getSectionTitle(sectionName))
    );
    if (activeTab) activeTab.classList.add('active');
    
    const activeNav = Array.from(document.querySelectorAll('.nav-link')).find(link => 
        link.textContent.includes(getSectionTitle(sectionName))
    );
    if (activeNav) activeNav.classList.add('active');

    // تحميل بيانات إضافية حسب القسم
    if (sectionName === 'transactions') {
        loadTransactions();
    }
}

function getSectionTitle(sectionName) {
    const titles = {
        'overview': 'نظرة عامة',
        'edit-profile': 'الملف الشخصي',
        'security': 'الأمان',
        'deposit': 'شحن الرصيد',
        'transactions': 'المعاملات'
    };
    return titles[sectionName] || sectionName;
}

// دوال العرض
function showAlert(message, type = 'success') {
    const container = document.getElementById('alert-container');
    const alertClass = type === 'success' ? 'alert-success' : 'alert-error';
    
    container.innerHTML = `
        <div class="alert ${alertClass}">
            <i class="fas fa-${type === 'success' ? 'check' : 'exclamation'}-circle"></i>
            ${message}
        </div>
    `;
    
    setTimeout(() => {
        container.innerHTML = '';
    }, 5000);
}

function showLoading(message = 'جاري التحميل...') {
    const container = document.getElementById('alert-container');
    container.innerHTML = `
        <div class="alert alert-info">
            <i class="fas fa-spinner fa-spin"></i>
            ${message}
        </div>
    `;
}

function hideLoading() {
    const container = document.getElementById('alert-container');
    const loadingAlert = container.querySelector('.alert-info');
    if (loadingAlert) {
        loadingAlert.remove();
    }
}

// التهيئة
document.addEventListener('DOMContentLoaded', function() {
    // تحميل بيانات المستخدم الحقيقية
    loadUserData();
    
    // إعداد المستمعين للأحداث
    setupEventListeners();
});

function setupEventListeners() {
    // تحديث الملف الشخصي
    document.getElementById('profileForm').addEventListener('submit', handleProfileUpdate);
    
    // تغيير كلمة السر
    document.getElementById('securityForm').addEventListener('submit', handlePasswordChange);
    
    // شحن الرصيد
    document.getElementById('depositForm').addEventListener('submit', handleDeposit);
    
    // تسجيل الخروج
    document.getElementById('logoutBtn').addEventListener('click', handleLogout);
}

// تحميل بيانات المستخدم الحقيقية
async function loadUserData() {
    try {
        showLoading('جاري تحميل البيانات...');
        
        const response = await fetch('/api/user/profile', { 
            headers: headers 
        });
        
        if (!response.ok) {
            if (response.status === 401) {
                handleSessionExpired();
                return;
            }
            throw new Error('فشل تحميل البيانات');
        }

        userData = await response.json();
        displayUserData(userData);
        
        // تحميل الطلبات الشخصية للإحصائيات
        await loadUserOrders();
        
        hideLoading();
        
    } catch (error) {
        hideLoading();
        showAlert('❌ ' + error.message, 'error');
        console.error('خطأ في تحميل البيانات:', error);
    }
}

// تحميل طلبات المستخدم للإحصائيات
// تحميل طلبات المستخدم للإحصائيات - استبدال الدالة الحالية
async function loadUserOrders() {
    try {
        const response = await fetch('/api/user/orders', { 
            headers: headers 
        });
        
        if (response.ok) {
            const orders = await response.json();
            updateOrderStats(orders);
        } else {
            console.error('فشل تحميل الطلبات:', response.status);
        }
    } catch (error) {
        console.error('خطأ في تحميل الطلبات:', error);
    }
}

// تحديث إحصائيات الطلبات
// تحديث دالة updateOrderStats لتعمل بشكل صحيح
function updateOrderStats(orders) {
    if (!orders || !Array.isArray(orders)) {
        console.log('لا توجد طلبات أو بيانات غير صالحة');
        return;
    }
    
    const totalOrders = orders.length;
    const completedOrders = orders.filter(order => order.status === 'completed').length;
    const pendingOrders = orders.filter(order => order.status === 'pending').length;
    
    console.log(`📊 الإحصائيات: ${totalOrders} طلبات, ${completedOrders} مكتملة`);
    
    // تحديث الواجهة
    document.getElementById('totalOrders').textContent = totalOrders;
    document.getElementById('completedOrders').textContent = completedOrders;
    
    // تحديث بيانات المستخدم
    if (userData.orders) {
        userData.orders.total = totalOrders;
        userData.orders.completed = completedOrders;
        userData.orders.pending = pendingOrders;
    }
}

// تحديث دالة رفع الصورة الشخصية
async function handleAvatarUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    // التحقق من حجم الملف (5MB كحد أقصى)
    if (file.size > 5 * 1024 * 1024) {
        showAlert('❌ حجم الصورة يجب أن يكون أقل من 5MB', 'error');
        return;
    }

    // التحقق من نوع الملف
    const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
    if (!validTypes.includes(file.type)) {
        showAlert('❌ نوع الملف غير مدعوم. الرجاء استخدام JPG, PNG, أو GIF', 'error');
        return;
    }

    try {
        showLoading('جاري رفع الصورة...');
        
        // إنشاء FormData لرفع الملف
        const formData = new FormData();
        formData.append('avatar', file);

        const response = await fetch('/api/user/upload-avatar', {
            method: 'POST',
            headers: {
                'x-auth-token': headers['x-auth-token']
            },
            body: formData
        });

        if (response.ok) {
            const result = await response.json();
            document.getElementById('userAvatar').src = result.avatar;
            showAlert('✅ تم تحديث الصورة الشخصية بنجاح', 'success');
            
            // تحديث الصورة في الهيدر أيضاً
            const headerAvatar = document.getElementById('headerAvatar');
            if (headerAvatar) {
                headerAvatar.src = result.avatar;
            }
        } else {
            const errorData = await response.json();
            throw new Error(errorData.error || 'فشل رفع الصورة');
        }
    } catch (error) {
        showAlert('❌ ' + error.message, 'error');
        console.error('خطأ في رفع الصورة:', error);
    } finally {
        hideLoading();
    }
}    
    
// عرض بيانات المستخدم الحقيقية
function displayUserData(data) {
    // المعلومات الأساسية
    document.getElementById('userFullName').textContent = data.fullName || data.username;
    document.getElementById('userUsername').textContent = '@' + data.username;
    document.getElementById('userBalance').textContent = '$' + (data.balance || 0).toFixed(2);
    document.getElementById('totalOrders').textContent = data.orders?.total || 0;
    document.getElementById('completedOrders').textContent = data.orders?.completed || 0;
    
    // حالة الحساب
    const statusElement = document.getElementById('userStatus');
    if (data.status === 'active') {
        statusElement.className = 'profile-status';
        statusElement.textContent = 'نشط';
        statusElement.style.background = 'var(--success)';
    } else if (data.status === 'suspended') {
        statusElement.className = 'profile-status';
        statusElement.textContent = 'موقوف';
        statusElement.style.background = 'var(--warning)';
    } else {
        statusElement.className = 'profile-status';
        statusElement.textContent = 'محظور';
        statusElement.style.background = 'var(--danger)';
    }

    // الصورة الشخصية
    if (data.avatar && data.avatar !== '/assets/default-avatar.png') {
        document.getElementById('userAvatar').src = data.avatar;
    }

    // قسم النظرة العامة
    document.getElementById('overviewUsername').value = data.username;
    document.getElementById('overviewEmail').value = data.email;
    document.getElementById('overviewPhone').value = data.phone || 'غير مضبوط';
    
    if (data.createdAt) {
        const joinDate = new Date(data.createdAt).toLocaleDateString('ar-SA');
        document.getElementById('overviewJoinDate').value = joinDate;
    }

    // قسم تعديل الملف
    document.getElementById('profileUsername').value = data.username;
    document.getElementById('profileEmail').value = data.email;
    document.querySelector('[name="fullName"]').value = data.fullName || '';
    document.querySelector('[name="phone"]').value = data.phone || '';
}

// تحديث الملف الشخصي
async function handleProfileUpdate(e) {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الحفظ...';
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/user/profile', {
            method: 'PUT',
            headers: headers,
            body: JSON.stringify(data)
        });

        if (response.ok) {
            showAlert('✅ تم تحديث الملف الشخصي بنجاح', 'success');
            loadUserData(); // إعادة تحميل البيانات
        } else {
            const errorData = await response.json();
            throw new Error(errorData.error || 'فشل تحديث البيانات');
        }
    } catch (error) {
        showAlert('❌ ' + error.message, 'error');
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
}

// تغيير كلمة السر
async function handlePasswordChange(e) {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    if (data.newPassword !== data.confirmPassword) {
        showAlert('❌ كلمات السر غير متطابقة', 'error');
        return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التغيير...';
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/user/change-password', {
            method: 'PUT',
            headers: headers,
            body: JSON.stringify({
                currentPassword: data.currentPassword,
                newPassword: data.newPassword
            })
        });

        const result = await response.json();

        if (response.ok) {
            showAlert('✅ ' + result.message, 'success');
            e.target.reset();
        } else {
            throw new Error(result.error || 'فشل تغيير كلمة السر');
        }
    } catch (error) {
        showAlert('❌ ' + error.message, 'error');
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
}

// شحن الرصيد
async function handleDeposit(e) {
    e.preventDefault();
    
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData.entries());
    
    if (!data.amount || data.amount <= 0) {
        showAlert('❌ الرجاء إدخال مبلغ صحيح', 'error');
        return;
    }

    if (!data.method) {
        showAlert('❌ الرجاء اختيار طريقة الدفع', 'error');
        return;
    }

    const submitBtn = e.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.innerHTML;

    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';
    submitBtn.disabled = true;

    try {
        const response = await fetch('/api/user/deposit', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (response.ok) {
            showAlert('✅ ' + result.message, 'success');
            e.target.reset();
            loadUserData(); // تحديث الرصيد
            loadTransactions(); // تحديث المعاملات
        } else {
            throw new Error(result.error || 'فشل طلب الشحن');
        }
    } catch (error) {
        showAlert('❌ ' + error.message, 'error');
    } finally {
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
    }
}

// تحميل المعاملات الحقيقية
async function loadTransactions() {
    try {
        const response = await fetch('/api/user/transactions', { 
            headers: headers 
        });
        
        if (response.ok) {
            const transactions = await response.json();
            displayTransactions(transactions);
        } else {
            throw new Error('فشل تحميل المعاملات');
        }
    } catch (error) {
        console.error('خطأ في تحميل المعاملات:', error);
        document.getElementById('transactionsList').innerHTML = `
            <div class="text-center py-4 text-muted">
                <i class="fas fa-exclamation-circle"></i>
                <p>فشل تحميل المعاملات</p>
            </div>
        `;
    }
}

// عرض المعاملات الحقيقية
function displayTransactions(transactions) {
    const container = document.getElementById('transactionsList');
    
    if (!transactions || transactions.length === 0) {
        container.innerHTML = `
            <div class="text-center py-5 text-muted">
                <i class="fas fa-receipt fa-2x mb-3 opacity-50"></i>
                <h5>لا توجد معاملات</h5>
                <p class="mb-0">لم تقم بأي معاملات حتى الآن</p>
            </div>
        `;
        return;
    }

    container.innerHTML = transactions.map(transaction => `
        <div class="transaction-item">
            <div class="transaction-icon">
                <i class="fas fa-${getTransactionIcon(transaction.type)}"></i>
            </div>
            <div class="transaction-details">
                <div class="transaction-title">${getTransactionType(transaction.type)}</div>
                <div class="transaction-meta">
                    ${new Date(transaction.createdAt).toLocaleString('ar-SA')} • 
                    ${getStatusText(transaction.status)}
                </div>
                ${transaction.userNote ? `
                    <div class="transaction-note">${transaction.userNote}</div>
                ` : ''}
            </div>
            <div class="transaction-amount ${transaction.type === 'deposit' ? 'positive' : 'negative'}">
                ${transaction.type === 'deposit' ? '+' : '-'}$${Math.abs(transaction.amount).toFixed(2)}
            </div>
        </div>
    `).join('');

    // إضافة ستايل للألوان
    const style = document.createElement('style');
    style.textContent = `
        .transaction-amount.positive { color: var(--success); }
        .transaction-amount.negative { color: var(--danger); }
        .transaction-note { 
            font-size: 0.75rem; 
            color: var(--text-muted); 
            margin-top: 4px; 
        }
    `;
    document.head.appendChild(style);
}

// دوال مساعدة للمعاملات
function getTransactionIcon(type) {
    const icons = {
        'deposit': 'plus-circle',
        'withdraw': 'minus-circle',
        'payment': 'shopping-cart',
        'refund': 'undo'
    };
    return icons[type] || 'exchange-alt';
}

function getTransactionType(type) {
    const types = {
        'deposit': 'شحن رصيد',
        'withdraw': 'سحب رصيد',
        'payment': 'دفع',
        'refund': 'استرجاع'
    };
    return types[type] || type;
}

function getStatusText(status) {
    const texts = {
        'pending': 'قيد الانتظار',
        'completed': 'مكتمل',
        'rejected': 'مرفوض',
        'cancelled': 'ملغي'
    };
    return texts[status] || status;
}

// تسجيل الخروج
async function handleLogout(e) {
    e.preventDefault();
    
    if (!confirm('هل أنت متأكد من تسجيل الخروج؟')) {
        return;
    }

    try {
        await fetch('/api/auth/logout', {
            method: 'POST',
            headers: headers
        });
    } catch (error) {
        console.error('خطأ في تسجيل الخروج:', error);
    } finally {
        localStorage.removeItem('authToken');
        window.location.href = '/login.html';
    }
}

// التعامل مع انتهاء الجلسة
function handleSessionExpired() {
    showAlert('❌ انتهت الجلسة، يرجى تسجيل الدخول مرة أخرى', 'error');
    setTimeout(() => {
        localStorage.removeItem('authToken');
        window.location.href = '/login.html';
    }, 2000);
}

// التحقق من الجلسة بشكل دوري
setInterval(async () => {
    try {
        const response = await fetch('/api/user/profile', { 
            headers: headers 
        });
        if (!response.ok) {
            handleSessionExpired();
        }
    } catch (error) {
        console.error('خطأ في التحقق من الجلسة:', error);
    }
}, 5 * 60 * 1000);
