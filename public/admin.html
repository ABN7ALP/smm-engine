<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlElement">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Professional SMM Dashboard - Fully Responsive & Stable" />
  <title>Dashboard - SMM Management System</title>

  <!-- Ant Design CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.13.0/antd.min.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    body { 
      font-family: 'Inter', 'Cairo', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #f5f5f5;
    }

    #root { width: 100%; height: 100%; }

    body.dark-mode {
      background: #141414;
    }

    /* RTL Support */
    [dir="rtl"] .ant-layout-sider {
      border-right: none;
      border-left: 1px solid #f0f0f0;
    }

    [dir="rtl"] .ant-layout-sider.ant-layout-sider-dark {
      border-left: 1px solid #434343;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }

    ::-webkit-scrollbar-thumb {
      background: #888;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    body.dark-mode ::-webkit-scrollbar-track {
      background: #262626;
    }

    body.dark-mode ::-webkit-scrollbar-thumb {
      background: #595959;
    }

    /* Custom Cards */
    .stat-card {
      border-radius: 8px;
      padding: 24px;
      background: white;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 6px rgba(0, 0, 0, 0.03), 0 1px 12px rgba(0, 0, 0, 0.12);
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15), 0 2px 4px rgba(0, 0, 0, 0.12);
      transform: translateY(-2px);
    }

    body.dark-mode .stat-card {
      background: #262626;
    }

    .stat-value {
      font-size: 32px;
      font-weight: 700;
      color: #1890ff;
      margin: 12px 0;
    }

    .stat-label {
      font-size: 14px;
      color: #8c8c8c;
      font-weight: 500;
    }

    body.dark-mode .stat-label {
      color: #a6a6a6;
    }

    /* Loading */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(0, 0, 0, 0.1);
      border-radius: 50%;
      border-top-color: #1890ff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tables */
    .ant-table {
      font-size: 14px;
    }

    .ant-table-thead > tr > th {
      background: #fafafa;
      font-weight: 600;
    }

    body.dark-mode .ant-table-thead > tr > th {
      background: #1f1f1f;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .stat-card {
        padding: 16px;
      }

      .stat-value {
        font-size: 24px;
      }

      .ant-table {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React & ReactDOM -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>

  <!-- Babel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Ant Design -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/5.13.0/antd.min.js"></script>

  <!-- Main App -->
  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;
    const { Layout, Menu, Button, Table, Form, Input, Select, Modal, message, Spin, Card, Row, Col, Tag, Space, Badge, Avatar, Empty, Popconfirm, Tooltip, Drawer, Divider } = antd;
    const { Header, Sider, Content } = Layout;

    // ============================================
    // TRANSLATIONS
    // ============================================
    const translations = {
      en: {
        'dashboard': 'Dashboard',
        'orders': 'Orders',
        'services': 'Services',
        'add_service': 'Add Service',
        'logs': 'Logs',
        'logout': 'Logout',
        'admin': 'Admin',
        'system_manager': 'System Manager',
        'overview': 'Overview',
        'total_services': 'Total Services',
        'total_orders': 'Total Orders',
        'pending_orders': 'Pending Orders',
        'avg_price': 'Avg Price',
        'control_tools': 'Control Tools',
        'refresh_data': 'Refresh Data',
        'export_services': 'Export Services (CSV)',
        'export_orders': 'Export Orders (CSV)',
        'manage_orders': 'Manage Orders',
        'manage_services': 'Manage Services',
        'add_edit_service': 'Add / Edit Service',
        'system_logs': 'System Logs',
        'search': 'Search',
        'id': 'ID',
        'service': 'Service',
        'link': 'Link',
        'qty': 'Qty',
        'price': 'Price',
        'status': 'Status',
        'actions': 'Actions',
        'name': 'Name',
        'category': 'Category',
        'type': 'Type',
        'service_name': 'Service Name',
        'service_type': 'Service Type',
        'quantity_service': 'Quantity Service (per 1000)',
        'fixed_price': 'Fixed Price',
        'price_per_1000': 'Price per 1000',
        'min_quantity': 'Min Quantity',
        'max_quantity': 'Max Quantity',
        'save': 'Save',
        'cancel': 'Cancel',
        'delete': 'Delete',
        'edit': 'Edit',
        'data_refreshed': 'Data refreshed successfully',
        'order_status_updated': 'Order status updated successfully',
        'session_expired': 'Session expired. Please login again.',
        'failed_to_update': 'Failed to update',
        'failed_to_delete': 'Failed to delete',
        'no_data': 'No data available',
        'loading': 'Loading...',
        'pending': 'Pending',
        'processing': 'Processing',
        'completed': 'Completed',
        'rejected': 'Rejected',
        'confirm_delete': 'Are you sure you want to delete this?',
        'confirm_logout': 'Are you sure you want to logout?',
      },
      ar: {
        'dashboard': 'لوحة التحكم',
        'orders': 'الطلبات',
        'services': 'الخدمات',
        'add_service': 'إضافة خدمة',
        'logs': 'السجلات',
        'logout': 'تسجيل الخروج',
        'admin': 'المسؤول',
        'system_manager': 'مدير النظام',
        'overview': 'نظرة عامة',
        'total_services': 'إجمالي الخدمات',
        'total_orders': 'إجمالي الطلبات',
        'pending_orders': 'الطلبات المعلقة',
        'avg_price': 'متوسط السعر',
        'control_tools': 'أدوات التحكم',
        'refresh_data': 'تحديث البيانات',
        'export_services': 'تصدير الخدمات (CSV)',
        'export_orders': 'تصدير الطلبات (CSV)',
        'manage_orders': 'إدارة الطلبات',
        'manage_services': 'إدارة الخدمات',
        'add_edit_service': 'إضافة / تعديل خدمة',
        'system_logs': 'سجلات النظام',
        'search': 'بحث',
        'id': 'المعرّف',
        'service': 'الخدمة',
        'link': 'الرابط',
        'qty': 'الكمية',
        'price': 'السعر',
        'status': 'الحالة',
        'actions': 'الإجراءات',
        'name': 'الاسم',
        'category': 'الفئة',
        'type': 'النوع',
        'service_name': 'اسم الخدمة',
        'service_type': 'نوع الخدمة',
        'quantity_service': 'خدمة كمية (لكل 1000)',
        'fixed_price': 'سعر ثابت',
        'price_per_1000': 'السعر لكل 1000',
        'min_quantity': 'الحد الأدنى للكمية',
        'max_quantity': 'الحد الأقصى للكمية',
        'save': 'حفظ',
        'cancel': 'إلغاء',
        'delete': 'حذف',
        'edit': 'تعديل',
        'data_refreshed': 'تم تحديث البيانات بنجاح',
        'order_status_updated': 'تم تحديث حالة الطلب بنجاح',
        'session_expired': 'انتهت الجلسة. يرجى تسجيل الدخول مرة أخرى.',
        'failed_to_update': 'فشل التحديث',
        'failed_to_delete': 'فشل الحذف',
        'no_data': 'لا توجد بيانات',
        'loading': 'جاري التحميل...',
        'pending': 'معلق',
        'processing': 'قيد المعالجة',
        'completed': 'مكتمل',
        'rejected': 'مرفوض',
        'confirm_delete': 'هل أنت متأكد من حذف هذا العنصر؟',
        'confirm_logout': 'هل أنت متأكد من تسجيل الخروج؟',
      }
    };

    // ============================================
    // MAIN APP COMPONENT
    // ============================================
    function DashboardApp() {
      const [lang, setLang] = useState(localStorage.getItem('language') || 'en');
      const [darkMode, setDarkMode] = useState(localStorage.getItem('theme') === 'dark' || window.matchMedia('(prefers-color-scheme: dark)').matches);
      const [collapsed, setCollapsed] = useState(false);
      const [currentPage, setCurrentPage] = useState('dashboard');
      const [loading, setLoading] = useState(false);
      const [stats, setStats] = useState({ totalServices: 0, totalOrders: 0, pendingOrders: 0, avgPrice: 0 });
      const [services, setServices] = useState([]);
      const [orders, setOrders] = useState([]);
      const [logs, setLogs] = useState([]);
      const [form] = Form.useForm();
      const [editingService, setEditingService] = useState(null);

      const token = localStorage.getItem('authToken');

      // Helper function
      const t = (key) => translations[lang][key] || key;

      // Update HTML
      useEffect(() => {
        const html = document.documentElement;
        html.lang = lang;
        html.dir = lang === 'ar' ? 'rtl' : 'ltr';
        localStorage.setItem('language', lang);
        document.body.classList.toggle('dark-mode', darkMode);
        localStorage.setItem('theme', darkMode ? 'dark' : 'light');
      }, [lang, darkMode]);

      // Check token
      useEffect(() => {
        if (!token) {
          window.location.href = '/login.html';
        }
      }, [token]);

      // Fetch data
      const fetchData = useCallback(async () => {
        setLoading(true);
        try {
          const headers = { 'Content-Type': 'application/json', 'x-auth-token': token };

          const [statsRes, servicesRes, ordersRes, logsRes] = await Promise.all([
            fetch('/api/stats', { headers }).catch(() => null),
            fetch('/api/services', { headers }).catch(() => null),
            fetch('/api/orders', { headers }).catch(() => null),
            fetch('/api/logs', { headers }).catch(() => null)
          ]);

          if (statsRes && statsRes.status === 401) {
            message.error(t('session_expired'));
            localStorage.removeItem('authToken');
            setTimeout(() => { window.location.href = '/login.html'; }, 1500);
            return;
          }
    const statsData = statsRes ? await statsRes.json() : {};
          const servicesData = servicesRes ? await servicesRes.json() : [];
          const ordersData = ordersRes ? await ordersRes.json() : [];
          const logsData = logsRes ? await logsRes.json() : [];

          setStats(statsData || {});
          setServices(Array.isArray(servicesData) ? servicesData : []);
          setOrders(Array.isArray(ordersData) ? ordersData : []);
          setLogs(Array.isArray(logsData) ? logsData : []);
          message.success(t('data_refreshed'));
        } catch (error) {
          console.error('Error fetching data:', error);
          message.error(t('failed_to_update'));
        } finally {
          setLoading(false);
        }
      }, [token, t]);

      // Initial load
      useEffect(() => {
        fetchData();
      }, [fetchData]);

      // Logout
      const handleLogout = async () => {
        Modal.confirm({
          title: t('confirm_logout'),
          onOk: async () => {
            try {
              await fetch('/api/auth/logout', {
                method: 'POST',
                headers: { 'x-auth-token': token }
              }).catch(() => null);
            } catch (error) {
              console.log('Logout error:', error);
            }
            localStorage.removeItem('authToken');
            message.success(t('data_refreshed'));
            setTimeout(() => { window.location.href = '/login.html'; }, 1000);
          }
        });
      };

      // Menu items
      const menuItems = [
        {
          key: 'dashboard',
          icon: <i className="fas fa-tachometer-alt"></i>,
          label: t('dashboard'),
        },
        {
          key: 'orders',
          icon: <i className="fas fa-shopping-cart"></i>,
          label: t('orders'),
        },
        {
          key: 'services',
          icon: <i className="fas fa-cogs"></i>,
          label: t('services'),
        },
        {
          key: 'add-service',
          icon: <i className="fas fa-plus-circle"></i>,
          label: t('add_service'),
        },
        {
          key: 'logs',
          icon: <i className="fas fa-history"></i>,
          label: t('logs'),
        },
      ];

      return (
        <Layout style={{ minHeight: '100vh' }}>
          {/* Sidebar */}
          <Sider
            trigger={null}
            collapsible
            collapsed={collapsed}
            width={256}
            theme={darkMode ? 'dark' : 'light'}
            breakpoint="md"
            onBreakpoint={(broken) => setCollapsed(broken)}
            style={{
              overflow: 'auto',
              height: '100vh',
              position: 'fixed',
              left: lang === 'ar' ? 'auto' : 0,
              right: lang === 'ar' ? 0 : 'auto',
              top: 0,
              bottom: 0,
            }}
          >
            <div style={{ padding: '16px', textAlign: 'center', borderBottom: '1px solid #f0f0f0' }}>
              <Avatar size={48} icon={<i className="fas fa-chart-line"></i>} style={{ backgroundColor: '#1890ff' }} />
              {!collapsed && <div style={{ marginTop: '12px', fontWeight: 'bold' }}>SMM Dashboard</div>}
            </div>
            <Menu
              theme={darkMode ? 'dark' : 'light'}
              mode="inline"
              selectedKeys={[currentPage]}
              items={menuItems}
              onClick={(e) => setCurrentPage(e.key)}
            />
            <div style={{ padding: '16px', borderTop: '1px solid #f0f0f0', marginTop: 'auto' }}>
              <Button block danger onClick={handleLogout} icon={<i className="fas fa-sign-out-alt"></i>}>
                {!collapsed && t('logout')}
              </Button>
            </div>
          </Sider>

          {/* Main Layout */}
          <Layout style={{ marginLeft: lang === 'ar' ? 0 : (collapsed ? 80 : 256), marginRight: lang === 'ar' ? (collapsed ? 80 : 256) : 0, transition: 'all 0.2s' }}>
            {/* Header */}
            <Header style={{ background: darkMode ? '#141414' : '#fff', padding: '0 24px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', boxShadow: '0 1px 4px rgba(0,0,0,0.08)', position: 'sticky', top: 0, zIndex: 99 }}>
              <Button
                type="text"
                icon={<i className="fas fa-bars"></i>}
                onClick={() => setCollapsed(!collapsed)}
              />
              <Space>
                <Button
                  type="text"
                  onClick={() => setLang(lang === 'en' ? 'ar' : 'en')}
                >
                  {lang === 'en' ? '🇸🇦 AR' : '🇺🇸 EN'}
                </Button>
                <Button
                  type="text"
                  icon={darkMode ? <i className="fas fa-sun"></i> : <i className="fas fa-moon"></i>}
                  onClick={() => setDarkMode(!darkMode)}
                />
              </Space>
            </Header>

            {/* Content */}
            <Content style={{ padding: '24px', background: darkMode ? '#141414' : '#f5f5f5', minHeight: 'calc(100vh - 64px)' }}>
              <Spin spinning={loading} tip={t('loading')}>
                {currentPage === 'dashboard' && <DashboardPage stats={stats} onRefresh={fetchData} t={t} />}
                {currentPage === 'orders' && <OrdersPage orders={orders} services={services} t={t} />}
                {currentPage === 'services' && <ServicesPage services={services} onRefresh={fetchData} t={t} />}
                {currentPage === 'add-service' && <AddServicePage onRefresh={fetchData} t={t} />}
                {currentPage === 'logs' && <LogsPage logs={logs} t={t} />}
              </Spin>
            </Content>
          </Layout>
        </Layout>
      );
    }

    // ============================================
    // DASHBOARD PAGE
    // ============================================
    function DashboardPage({ stats, onRefresh, t }) {
      return (
        <div>
          <h1 style={{ marginBottom: '24px' }}>{t('overview')}</h1>
          <Row gutter={[16, 16]}>
            <Col xs={24} sm={12} lg={6}>
              <Card className="stat-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <div className="stat-label">{t('total_services')}</div>
                    <div className="stat-value">{stats.totalServices || 0}</div>
                  </div>
                  <Avatar size={64} icon={<i className="fas fa-cogs"></i>} style={{ backgroundColor: '#1890ff' }} />
                </div>
              </Card>
            </Col>
            <Col xs={24} sm={12} lg={6}>
              <Card className="stat-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <div className="stat-label">{t('total_orders')}</div>
                    <div className="stat-value">{stats.totalOrders || 0}</div>
                  </div>
                  <Avatar size={64} icon={<i className="fas fa-shopping-cart"></i>} style={{ backgroundColor: '#52c41a' }} />
                </div>
              </Card>
            </Col>
            <Col xs={24} sm={12} lg={6}>
              <Card className="stat-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <div className="stat-label">{t('pending_orders')}</div>
                    <div className="stat-value">{stats.pendingOrders || 0}</div>
                  </div>
                  <Avatar size={64} icon={<i className="fas fa-hourglass-half"></i>} style={{ backgroundColor: '#faad14' }} />
                </div>
              </Card>
            </Col>
            <Col xs={24} sm={12} lg={6}>
              <Card className="stat-card">
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                  <div>
                    <div className="stat-label">{t('avg_price')}</div>
                    <div className="stat-value">${(stats.avgPrice || 0).toFixed(2)}</div>
                  </div>
                  <Avatar size={64} icon={<i className="fas fa-dollar-sign"></i>} style={{ backgroundColor: '#722ed1' }} />
                </div>
              </Card>
            </Col>
          </Row>

          <Card style={{ marginTop: '24px' }}>
            <h2>{t('control_tools')}</h2>
            <Space wrap>
              <Button type="primary" icon={<i className="fas fa-sync-alt"></i>} onClick={onRefresh}>
                {t('refresh_data')}
              </Button>
              <Button icon={<i className="fas fa-download"></i>}>
                {t('export_services')}
              </Button>
              <Button icon={<i className="fas fa-download"></i>}>
                {t('export_orders')}
              </Button>
            </Space>
          </Card>
        </div>
      );
    }

    // ============================================
    // ORDERS PAGE
    // ============================================
    function OrdersPage({ orders, services, t }) {
      const serviceMap = useMemo(() => {
        const map = {};
        (services || []).forEach(s => {
          if (s && s.id) map[s.id] = s;
        });
        return map;
      }, [services]);

      const columns = [
        { title: t('id'), dataIndex: 'id', key: 'id', width: 80 },
        { 
          title: t('service'), 
          dataIndex: 'serviceId', 
          key: 'serviceId', 
          render: (serviceId) => {
            const service = serviceMap[serviceId];
            return service ? service.name : '-';
          }
        },
        { 
          title: t('link'), 
          dataIndex: 'link', 
          key: 'link', 
          render: (link) => {
            if (link && typeof link === 'string') {
              return <a href={link} target="_blank" rel="noopener">{link.substring(0, 30)}...</a>;
            }
            return '-';
          }
        },
        { title: t('qty'), dataIndex: 'quantity', key: 'quantity', width: 80 },
        { 
          title: t('price'), 
          dataIndex: 'price', 
          key: 'price', 
          render: (price) => `$${(price || 0).toFixed(2)}` 
        },
        {
          title: t('status'),
          dataIndex: 'status',
          key: 'status',
          render: (status) => {
            const colors = { pending: 'gold', processing: 'blue', completed: 'green', rejected: 'red' };
            return <Tag color={colors[status] || 'default'}>{status}</Tag>;
          }
        },
      ];

      return (
        <Card>
          <h1>{t('manage_orders')}</h1>
          <Input placeholder={t('search')} style={{ marginBottom: '16px' }} />
          <Table 
            columns={columns} 
            dataSource={orders || []} 
            rowKey="id" 
            pagination={{ pageSize: 10 }}
            locale={{ emptyText: t('no_data') }}
          />
        </Card>
      );
    }

    // ============================================
    // SERVICES PAGE
    // ============================================
    function ServicesPage({ services, onRefresh, t }) {
      const columns = [
        { title: t('id'), dataIndex: 'id', key: 'id', width: 80 },
        { title: t('name'), dataIndex: 'name', key: 'name' },
        { title: t('category'), dataIndex: 'category', key: 'category' },
        { 
          title: t('type'), 
          dataIndex: 'type', 
          key: 'type', 
          render: (type) => type === 'fixed' ? 'Fixed' : 'Quantity' 
        },
        { 
          title: t('price'), 
          dataIndex: 'price', 
          key: 'price', 
          render: (price, record) => {
            if (record.type === 'fixed') {
              return `$${price || 0}`;
            }
            return `$${record.rate || 0}/1k`;
          }
        },
        {
          title: t('actions'),
          key: 'actions',
          render: (_, record) => (
            <Space>
              <Button type="primary" size="small" icon={<i className="fas fa-edit"></i>} />
              <Popconfirm 
                title={t('confirm_delete')} 
                onConfirm={() => console.log('delete', record.id)}
              >
                <Button danger size="small" icon={<i className="fas fa-trash"></i>} />
              </Popconfirm>
            </Space>
          ),
        },
      ];

      return (
        <Card>
          <h1>{t('manage_services')}</h1>
          <Input placeholder={t('search')} style={{ marginBottom: '16px' }} />
          <Table 
            columns={columns} 
            dataSource={services || []} 
            rowKey="id" 
            pagination={{ pageSize: 10 }}
            locale={{ emptyText: t('no_data') }}
          />
        </Card>
      );
    }

    // ============================================
    // ADD SERVICE PAGE
    // ============================================
    function AddServicePage({ onRefresh, t }) {
      const [form] = Form.useForm();

      return (
        <Card>
          <h1>{t('add_edit_service')}</h1>
          <Form layout="vertical" form={form}>
            <Form.Item label={t('service_name')} name="name" rules={[{ required: true }]}>
              <Input />
            </Form.Item>
            <Form.Item label={t('category')} name="category" rules={[{ required: true }]}>
              <Input />
            </Form.Item>
            <Form.Item label={t('service_type')} name="type" rules={[{ required: true }]}>
              <Select options={[
                { label: t('quantity_service'), value: 'quantity' },
                { label: t('fixed_price'), value: 'fixed' }
              ]} />
            </Form.Item>
            <Form.Item label={t('price_per_1000')} name="rate" rules={[{ required: true }]}>
              <Input type="number" step="0.01" />
            </Form.Item>
            <Space>
              <Button type="primary" htmlType="submit" icon={<i className="fas fa-save"></i>}>
                {t('save')}
              </Button>
              <Button onClick={() => form.resetFields()}>
                {t('cancel')}
              </Button>
            </Space>
          </Form>
        </Card>
      );
    }

    // ============================================
    // LOGS PAGE
    // ============================================
    function LogsPage({ logs, t }) {
      if (!logs || logs.length === 0) {
        return (
          <Card>
            <h1>{t('system_logs')}</h1>
            <Empty description={t('no_data')} />
          </Card>
        );
      }

      return (
        <Card>
          <h1>{t('system_logs')}</h1>
          <div style={{ maxHeight: '500px', overflowY: 'auto' }}>
            {logs.slice(0, 50).map((log, idx) => (
              <div key={idx} style={{ padding: '12px', borderBottom: '1px solid #f0f0f0', marginBottom: '8px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '4px' }}>
                  <strong>{log.user || 'Unknown'}</strong>
                  <span style={{ fontSize: '12px', color: '#999' }}>
                    {log.time ? new Date(log.time).toLocaleString() : '-'}
                  </span>
                </div>
                <p style={{ margin: 0, color: '#666' }}>{log.action || '-'}</p>
              </div>
            ))}
          </div>
        </Card>
      );
    }

    // ============================================
    // RENDER
    // ============================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DashboardApp />);
  </script>
</body>
</html>
